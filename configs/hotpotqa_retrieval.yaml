hotpotqa_retrieval:
  chunks_path: data/processed/hotpotqa_bm25_sample100_chunks.jsonl
  dense_index_dir: data/index/hotpotqa_dense_sample100
  output_path: results/hotpotqa_retrieval_core_sample100.json
  split:
    seed: 42
    dev_count: 20
  evaluation:
    top_ks: [1, 5, 10]
    ranking_depth: 50
  bm25:
    include_title: true
    k1: 1.5
    b: 0.75
    epsilon: 0.25
  dense:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    revision: null
    device: cpu
    cache_folder: D:/Tools/HuggingFaceCache/hub
    local_files_only: true
    batch_size: 32
  hybrid_search:
    candidate_ks: [10, 20, 50]
    rrf_ks: [10, 30, 60, 100]
  reranker:
    enabled: true
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    cache_dir: D:/Tools/HuggingFaceCache/hub
    local_files_only: true
    device: cpu
    max_length: 512
    batch_size: 32
    candidate_k: 20
